; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
; Board definition covers any ESP32-S3 devkit (DevKitC-1, DevKit-1, ...) —
; same chip, same env; only flash size differs per module variant. If the
; board has more than 4MB (e.g. N16), bump the flash_size lines below and
; consider growing the OTA app slots in partitions.csv.
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; N8R8 module: quad SPI flash + octal PSRAM. PSRAM is NOT enabled in the
; firmware yet (no -DBOARD_HAS_PSRAM); memory_type is set so enabling it
; later is a one-line change. Note octal PSRAM permanently uses GPIO 33-37.
board_build.arduino.memory_type = qio_opi
; OTA partition table for the 8MB flash: app0/app1 get 3.375MB each (see
; partitions.csv). USB upload writes the new partition table along with the
; image, so flash the new board over USB when moving off the 4MB DevKitC.
board_build.partitions = partitions.csv

; `pio run -e esp32-s3-devkitc-1 -t deploy` builds the firmware and copies
; it into releases/ as nhl_scoreboard_latest.bin plus a permanently archived
; nhl_scoreboard_<version>.bin matching FIRMWARE_VERSION in src/config.h.
extra_scripts = tools/release_deploy.py

monitor_speed = 115200

; Sport selection: each env compiles the generic framework in src/common/ plus
; exactly ONE folder under src/sports/. The -I flag puts that folder on the
; include path so "sport_config.h" (and the sport's own headers) resolve to
; the selected sport — src/common/ never names a sport directly.
; Starting a new sport: copy src/sports/nhl, then change sports/nhl below to
; the new folder in BOTH places.
build_src_filter =
    +<main.cpp>
    +<common/>
    +<sports/nhl/>

build_flags =
    ; Dev connection is the board's NATIVE USB-C port (USB OTG on GPIO
    ; 19/20): Serial maps to USB CDC so flash and monitor share one cable.
    ; (The CH343 UART-bridge port also works for flashing if you prefer;
    ; switch this to 0 and monitor UART0 to use it.)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/sports/nhl

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    ricmoo/QRCode@^0.0.1
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.15.0

; Network OTA env for development: flash over Wi-Fi (ArduinoOTA) instead of USB.
; Usage: pio run -e esp32-s3-devkitc-1-ota -t upload --upload-port <device-ip-or-nhl-scoreboard.local>
; mDNS (.local) discovery over Wi-Fi is occasionally flaky (dropped multicast packets) -
; retry once if "no response" occurs, or pass --upload-port with the device's IP
; (printed on Serial as "[NET] Online: ip=..." and shown on the TFT setup screen) to skip discovery entirely.
[env:esp32-s3-devkitc-1-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = nhl-scoreboard.local
upload_flags =
    --auth=score1234
    --timeout=120
